[project]
name = "my-smit-bakery"
version = "0.1.0"
description = "SMIT Bakery & Cafe Virtual RL Environment and Heuristic Simulation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.0.0",
    "stable-baselines3>=2.5.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "datasets>=3.0.0",
    "openmeteo-requests>=1.3.0",
    "requests-cache>=1.2.0",
    "retry-requests>=2.0.0",
    "holidays>=0.60",
    "matplotlib>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
